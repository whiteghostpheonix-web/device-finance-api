name = "device-finance-api"
main = "src/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "device-finance-db"
database_id = "de160f9b-e8ed-481d-b08b-a792c4ca5959"

[triggers]
crons = ["0 6 * * *"]

[[r2_buckets]]
binding = "APK_BUCKET"
bucket_name = "signal-dpc-apk"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "signal-dpc-media"

[vars]
DPC_UPDATE_ENABLED = "true"
DPC_LATEST_VERSION = "0.2.5"
DPC_LATEST_VERSION_CODE = "15"
DPC_APK_URL = "https://device-finance-api.whiteghostpheonix.workers.dev/download/apk/signal-dpc-v0.2.5.apk"
DPC_APK_SHA256 = "a43849554de6d2c784f47263cf249eec5086f162f7c107bb93c836634d15caa9"
DPC_CONFIG_VERSION = "1"
